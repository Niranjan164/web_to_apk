<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WEB TO APK</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #00ffe5;
      text-shadow: 1px 1px 5px #000;
    }
    #inputArea {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00ffe5aa;
      display: block;
    }
    input {
      padding: 10px;
      width: 300px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-bottom: 20px;
    }
    button {
      background-color: #00ffe5;
      color: #000;
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #00ccb3;
    }
  </style>
</head>
<body>
  <h1>WEB TO APK</h1>
  <div id="inputArea">
    <input type="text" id="urlInput" placeholder="Enter website URL (https://...)">
    <br>
    <button onclick="saveURL()">Save Link</button>
    <button onclick="openSavedURL()">Open Link</button>
  </div>

  <script>
    function saveURL() {
      const url = document.getElementById("urlInput").value.trim();
      if (url.startsWith("http://") || url.startsWith("https://")) {
        localStorage.setItem("savedLink", url);
        alert("URL saved successfully!");
      } else {
        alert("Please enter a valid URL starting with http:// or https://");
      }
    }

    function openSavedURL() {
      const savedURL = localStorage.getItem("savedLink");
      if (savedURL) {
        window.open(savedURL, "_blank");
      } else {
        alert("No saved URL found in localStorage.");
      }
    }
  </script>
</body>
</html>
