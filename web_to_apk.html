<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WEB TO APK</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #00ffe5;
      text-shadow: 1px 1px 5px #000;
    }
    #inputArea {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00ffe5aa;
      display: none;
      text-align: center;
    }
    input {
      padding: 10px;
      width: 300px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(to right, #ff416c, #ff4b2b);
      color: #fff;
      font-size: 18px;
      padding: 10px 25px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s ease;
      margin: 10px;
    }
    .btn:hover {
      background: linear-gradient(to right, #ff4b2b, #ff416c);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1 id="title">WEB TO APK</h1>
  <div id="inputArea">
    <p>Please enter your web app link:</p>
    <input type="url" id="linkInput" placeholder="https://example.com">
    <br>
    <button class="btn" onclick="saveLink()">Save & Open</button>
    <button class="btn" onclick="openSavedLink()">Open Saved Link</button>
  </div>

  <script>
    const KEY = "NIRANJAN";
    const savedLink = localStorage.getItem(KEY);

    // Redirect to correct path if needed
    if (window.location.pathname !== "/web_to_apk/" && window.location.hostname === "niranjan164.github.io") {
      window.location.href = "https://niranjan164.github.io/web_to_apk/";
    } else {
      document.getElementById("inputArea").style.display = "block";
    }

    function saveLink() {
      const link = document.getElementById("linkInput").value.trim();
      if (link && link.startsWith("http")) {
        localStorage.setItem(KEY, link);
        window.open(link, '_blank'); // open in new tab
      } else {
        alert("Please enter a valid URL starting with http or https.");
      }
    }

    function openSavedLink() {
      if (savedLink) {
        window.open(savedLink, '_blank');
      } else {
        alert("No saved link found. Please enter and save a link first.");
      }
    }
  </script>
</body>
</html>
